[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astroflow"
version = "0.1.0"
description = "Vision-based camera capture and flow matching localization of satellites"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]
brahe = ["brahe"]
viz = ["altair", "plotly", "pandas", "vl-convert-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
astroflow = ["viz/data/*.json"]
